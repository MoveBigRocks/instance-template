name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    if: github.repository != 'MoveBigRocks/instance-template'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout instance repo
        uses: actions/checkout@v6

      - name: Load instance configuration
        id: config
        run: |
          chmod +x scripts/read-instance-config.sh
          scripts/read-instance-config.sh mbr.instance.yaml >> "$GITHUB_OUTPUT"

      - name: Install ORAS
        run: |
          VERSION="1.2.3"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "oras_${VERSION}_linux_amd64.tar.gz"
          sudo mv oras /usr/local/bin/
          oras version

      - name: Optional registry login
        env:
          SERVICES_ARTIFACT: ${{ steps.config.outputs.services_artifact }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [[ -n "${REGISTRY_USERNAME}" && -n "${REGISTRY_TOKEN}" ]]; then
            REGISTRY_HOST=$(printf '%s\n' "${SERVICES_ARTIFACT}" | cut -d/ -f1)
            oras login "${REGISTRY_HOST}" --username "${REGISTRY_USERNAME}" --password "${REGISTRY_TOKEN}"
          else
            echo "No registry credentials provided; assuming public artifact access"
          fi

      - name: Verify pinned platform version integrity
        # Guards against two races that both cost a deploy cycle if they
        # trigger:
        #   1. Pinning a semver that the Release Pipeline annotated before the
        #      OCI semver tag step finished (older-sibling commit still
        #      latest-tag for a few seconds).
        #   2. Operator error: pinning a version whose published release
        #      records a different commit than the one assumed.
        # Both resolve to the same check: the published release manifest for
        # the pinned version and the OCI image tagged with that version must
        # refer to the same commit. If they disagree, or if either is
        # missing, abort.
        env:
          CORE_VERSION: ${{ steps.config.outputs.core_version }}
          SERVICES_ARTIFACT: ${{ steps.config.outputs.services_artifact }}
          MANIFEST_ARTIFACT: ${{ steps.config.outputs.manifest_artifact }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Verifying published release integrity for ${CORE_VERSION}"

          # Resolve the commit SHA recorded in the published release manifest
          # in the public MoveBigRocks/releases mirror.
          GIT_TAG_COMMIT="$(curl -fsSL "https://github.com/MoveBigRocks/releases/releases/download/${CORE_VERSION}/release-manifest.json" \
            | jq -r '.git_sha // empty' 2>/dev/null || echo '')"
          if [ -z "${GIT_TAG_COMMIT}" ]; then
            echo "::error::release ${CORE_VERSION} not found in the MoveBigRocks/releases mirror"
            exit 1
          fi
          echo "published release ${CORE_VERSION} -> ${GIT_TAG_COMMIT}"

          # Resolve the commit embedded in the OCI manifest the deploy would
          # actually pull. The release pipeline writes the git SHA into the
          # manifest.json that ships alongside the services/migrations
          # artifacts; extract it and compare.
          mkdir -p /tmp/pin-check
          oras pull "${MANIFEST_ARTIFACT}" -o /tmp/pin-check
          OCI_COMMIT="$(jq -r '.git_commit // .commit // empty' /tmp/pin-check/manifest.json)"
          if [ -z "${OCI_COMMIT}" ]; then
            echo "::error::OCI manifest for ${CORE_VERSION} has no git_commit field"
            exit 1
          fi
          echo "oci manifest ${MANIFEST_ARTIFACT} -> ${OCI_COMMIT}"

          # Normalise to matching prefix lengths to allow short-sha manifests.
          GIT_SHORT="${GIT_TAG_COMMIT:0:${#OCI_COMMIT}}"
          if [ "${GIT_SHORT}" != "${OCI_COMMIT}" ] && [ "${GIT_TAG_COMMIT}" != "${OCI_COMMIT}" ]; then
            echo "::error::pin integrity failure: published release ${CORE_VERSION} (${GIT_TAG_COMMIT}) and OCI manifest (${OCI_COMMIT}) disagree on commit. Likely cause: the pin was written before the Release Pipeline finished tagging the OCI artifacts, or the pin points at a stale version."
            exit 1
          fi
          echo "Pin integrity OK: ${CORE_VERSION} -> ${GIT_TAG_COMMIT}"
          rm -rf /tmp/pin-check

      - name: Verify immutable artifact digests
        env:
          SERVICES_ARTIFACT: ${{ steps.config.outputs.services_artifact }}
          MIGRATIONS_ARTIFACT: ${{ steps.config.outputs.migrations_artifact }}
          MANIFEST_ARTIFACT: ${{ steps.config.outputs.manifest_artifact }}
          SERVICES_DIGEST: ${{ steps.config.outputs.services_digest }}
          MIGRATIONS_DIGEST: ${{ steps.config.outputs.migrations_digest }}
          MANIFEST_DIGEST: ${{ steps.config.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          verify_digest() {
            name="$1"
            ref="$2"
            pinned="$3"
            resolved=$(oras manifest fetch --descriptor "${ref}" | jq -r '.digest')
            if [ -z "${resolved}" ] || [ "${resolved}" = null ]; then
              echo "::error::could not resolve digest for ${name} (${ref})"
              exit 1
            fi
            if [ -z "${pinned}" ]; then
              echo "::warning::${name} has no immutable digest pin; ${ref} resolves to ${resolved}"
              return 0
            fi
            if [ "${resolved}" != "${pinned}" ]; then
              echo "::error::${name} digest mismatch: ${ref} resolves to ${resolved}, expected ${pinned}"
              exit 1
            fi
            echo "${name}: verified ${pinned}"
          }
          verify_digest services "${SERVICES_ARTIFACT}" "${SERVICES_DIGEST}"
          verify_digest migrations "${MIGRATIONS_ARTIFACT}" "${MIGRATIONS_DIGEST}"
          verify_digest manifest "${MANIFEST_ARTIFACT}" "${MANIFEST_DIGEST}"

      - name: Verify artifact signatures (cosign)
        env:
          REQUIRE_COSIGN: ${{ steps.config.outputs.require_cosign }}
          COSIGN_VERIFICATION_MODE: ${{ steps.config.outputs.cosign_verification_mode }}
          COSIGN_KEY_FILE: ${{ steps.config.outputs.cosign_public_key_file }}
          COSIGN_CERTIFICATE_IDENTITY: ${{ steps.config.outputs.cosign_certificate_identity }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: ${{ steps.config.outputs.cosign_certificate_oidc_issuer }}
          SERVICES_ARTIFACT: ${{ steps.config.outputs.services_artifact }}
          MIGRATIONS_ARTIFACT: ${{ steps.config.outputs.migrations_artifact }}
          MANIFEST_ARTIFACT: ${{ steps.config.outputs.manifest_artifact }}
        run: |
          set -euo pipefail
          if [ "${REQUIRE_COSIGN}" != true ] && [ ! -f "${COSIGN_KEY_FILE}" ]; then
            echo "cosign verification is not required and no public key is configured; skipping"
            exit 0
          fi
          if [ "${COSIGN_VERIFICATION_MODE}" = key ] && [ ! -f "${COSIGN_KEY_FILE}" ]; then
            echo "::error::cosign public key ${COSIGN_KEY_FILE} is required but missing"
            exit 1
          fi

          cosign_version=v2.4.1
          curl -fsSLo cosign "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign-linux-amd64"
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign

          for ref in "${SERVICES_ARTIFACT}" "${MIGRATIONS_ARTIFACT}" "${MANIFEST_ARTIFACT}"; do
            echo "Verifying cosign signature for ${ref}"
            if [ "${COSIGN_VERIFICATION_MODE}" = keyless ]; then
              cosign verify \
                --certificate-identity "${COSIGN_CERTIFICATE_IDENTITY}" \
                --certificate-oidc-issuer "${COSIGN_CERTIFICATE_OIDC_ISSUER}" \
                "${ref}" >/dev/null
            else
              cosign verify --key "${COSIGN_KEY_FILE}" "${ref}" >/dev/null
            fi
          done

      - name: Pull release artifacts
        env:
          SERVICES_ARTIFACT: ${{ steps.config.outputs.services_artifact }}
          MIGRATIONS_ARTIFACT: ${{ steps.config.outputs.migrations_artifact }}
          MANIFEST_ARTIFACT: ${{ steps.config.outputs.manifest_artifact }}
        run: |
          mkdir -p artifacts
          cd artifacts

          oras pull "${SERVICES_ARTIFACT}"
          tar -xzf mbr-services.tar.gz
          rm mbr-services.tar.gz

          mkdir -p migrations
          oras pull "${MIGRATIONS_ARTIFACT}"
          tar -xzf migrations.tar.gz -C migrations
          rm migrations.tar.gz

          cp -R ../deploy ./deploy

          oras pull "${MANIFEST_ARTIFACT}"
          echo "Release manifest:"
          cat manifest.json | jq .

      - name: Generate extension runtime manifest from desired state
        run: |
          mkdir -p artifacts/extensions
          chmod +x artifacts/tools/reconcile-extensions
          cp extensions/desired-state.yaml artifacts/extensions/desired-state.yaml
          artifacts/tools/reconcile-extensions render-runtime-manifest \
            --desired-state extensions/desired-state.yaml \
            --output artifacts/extensions/runtime-manifest.json

      - name: Pull configured extension runtime artifacts
        run: |
          mkdir -p artifacts/extension-runtimes/bin

          jq -c '.runtimes[]' artifacts/extensions/runtime-manifest.json | while read -r runtime; do
            slug=$(printf '%s' "${runtime}" | jq -r '.slug')
            artifact=$(printf '%s' "${runtime}" | jq -r '.artifact')
            binary=$(printf '%s' "${runtime}" | jq -r '.binary')
            pull_dir="artifacts/extension-runtimes/pull-${slug}"

            rm -rf "${pull_dir}"
            mkdir -p "${pull_dir}"

            (
              cd "${pull_dir}"
              oras pull "${artifact}"
              runtime_tarball=$(find . -type f -name '*.tar.gz' | head -1)
              test -n "${runtime_tarball}" || {
                echo "Missing runtime tarball for ${slug}" >&2
                exit 1
              }
              tar -xzf "${runtime_tarball}"
            )

            runtime_binary=$(find "${pull_dir}" -type f -name "${binary}" | head -1)
            test -n "${runtime_binary}" || {
              echo "Missing runtime binary ${binary} for ${slug}" >&2
              exit 1
            }

            cp "${runtime_binary}" "artifacts/extension-runtimes/bin/${binary}"
          done
          # Per-extension env files are no longer generated: as of RFC-0016
          # the core mbr service supervises extension runtimes as child
          # processes and sets MBR_EXTENSION_RUNTIME_SOCKET_PATH per child
          # from its own slot-scoped config.

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy
          if ! grep -q "PRIVATE KEY" ~/.ssh/id_ed25519_deploy; then
            echo "Invalid SSH key format"
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/id_ed25519_deploy >/dev/null 2>&1 || { echo "Invalid SSH key"; exit 1; }

      - name: Determine deployment slot
        id: slot
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          ROOT_DIR: ${{ steps.config.outputs.root_dir }}
        run: |
          ACTIVE_SLOT=$(ssh -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no "mbr@${DEPLOY_HOST}" \
            "cat ${ROOT_DIR}/.active-slot 2>/dev/null || echo blue" 2>/dev/null || echo "blue")

          if [ "${ACTIVE_SLOT}" = "blue" ]; then
            DEPLOY_SLOT="green"
            DEPLOY_PORT="8081"
            OLD_PORT="8080"
          else
            DEPLOY_SLOT="blue"
            DEPLOY_PORT="8080"
            OLD_PORT="8081"
          fi

          echo "active_slot=${ACTIVE_SLOT}" >> "$GITHUB_OUTPUT"
          echo "deploy_slot=${DEPLOY_SLOT}" >> "$GITHUB_OUTPUT"
          echo "deploy_port=${DEPLOY_PORT}" >> "$GITHUB_OUTPUT"
          echo "old_port=${OLD_PORT}" >> "$GITHUB_OUTPUT"

      - name: Create deployment package
        run: |
          cd artifacts
          tar -czf /tmp/mbr-deploy.tar.gz mbr-server tools/ migrations/ deploy/ manifest.json extension-runtimes/ extensions/

      - name: Upload deployment package
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
        run: |
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            /tmp/mbr-deploy.tar.gz \
            "mbr@${DEPLOY_HOST}:/tmp/"

      - name: Create environment file
        env:
          ROOT_DIR: ${{ steps.config.outputs.root_dir }}
          INSTANCE_ID: ${{ steps.config.outputs.instance_id }}
          APP_DOMAIN: ${{ steps.config.outputs.app_domain }}
          COOKIE_DOMAIN: ${{ steps.config.outputs.cookie_domain }}
          EMAIL_PROVIDER: ${{ steps.config.outputs.email_provider }}
          FROM_EMAIL: ${{ steps.config.outputs.email_from_email }}
          FROM_NAME: ${{ steps.config.outputs.email_from_name }}
          INBOUND_MODE: ${{ steps.config.outputs.inbound_mode }}
          INBOUND_PROVIDER: ${{ steps.config.outputs.inbound_provider }}
          STORAGE_PROVIDER: ${{ steps.config.outputs.storage_provider }}
          STORAGE_REGION: ${{ steps.config.outputs.storage_region }}
          STORAGE_ENDPOINT: ${{ steps.config.outputs.storage_endpoint }}
          ATTACHMENTS_BUCKET: ${{ steps.config.outputs.attachments_bucket }}
          DATABASE_DSN: ${{ secrets.DATABASE_DSN }}
          SMTP_HOST: ${{ steps.config.outputs.smtp_host }}
          SMTP_PORT: ${{ steps.config.outputs.smtp_port }}
          SES_REGION: ${{ steps.config.outputs.ses_region }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          POSTMARK_WEBHOOK_SECRET: ${{ secrets.POSTMARK_WEBHOOK_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SES_ACCESS_KEY: ${{ secrets.SES_ACCESS_KEY }}
          SES_SECRET_KEY: ${{ secrets.SES_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cat > /tmp/mbr.env.tmp <<EOF
          ENVIRONMENT=${{ inputs.environment }}
          DOMAIN=${APP_DOMAIN}
          DATABASE_DSN=${DATABASE_DSN}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRY=24h
          MAGIC_LINK_TTL=15m
          COOKIE_DOMAIN=${COOKIE_DOMAIN}
          EMAIL_BACKEND=${EMAIL_PROVIDER}
          FROM_EMAIL=${FROM_EMAIL}
          FROM_NAME="${FROM_NAME}"
          STORAGE_PATH=${ROOT_DIR}/data
          EXTENSION_RUNTIME_DIR=${ROOT_DIR}/tmp/extensions
          CACHE_ENABLED=true
          CACHE_TTL=1h
          RATE_LIMIT_ENABLED=true
          RATE_LIMIT_PER_MIN=60
          METRICS_TOKEN=${METRICS_TOKEN}
          TRUSTED_PROXIES=127.0.0.1,::1
          INSTANCE_ID=${INSTANCE_ID}
          EXTENSION_TRUST_REQUIRE_VERIFICATION=false
          EOF

          case "${STORAGE_PROVIDER}" in
            s3-compatible)
              cat >> /tmp/mbr.env.tmp <<EOF
          STORAGE_TYPE=s3
          S3_REGION=${STORAGE_REGION}
          S3_ENDPOINT=${STORAGE_ENDPOINT}
          S3_ATTACHMENTS_BUCKET=${ATTACHMENTS_BUCKET}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          EOF
              ;;
            filesystem)
              cat >> /tmp/mbr.env.tmp <<EOF
          STORAGE_TYPE=filesystem
          EOF
              ;;
          esac

          case "${EMAIL_PROVIDER}" in
            postmark)
              cat >> /tmp/mbr.env.tmp <<EOF
          POSTMARK_SERVER_TOKEN=${POSTMARK_SERVER_TOKEN}
          EOF
              if [[ "${INBOUND_MODE}" == "webhook" && "${INBOUND_PROVIDER}" == "postmark" ]]; then
                cat >> /tmp/mbr.env.tmp <<EOF
          POSTMARK_WEBHOOK_SECRET=${POSTMARK_WEBHOOK_SECRET}
          EOF
              fi
              ;;
            smtp)
              cat >> /tmp/mbr.env.tmp <<EOF
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USERNAME=${SMTP_USERNAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          EOF
              ;;
            ses)
              cat >> /tmp/mbr.env.tmp <<EOF
          SES_REGION=${SES_REGION}
          SES_ACCESS_KEY=${SES_ACCESS_KEY}
          SES_SECRET_KEY=${SES_SECRET_KEY}
          EOF
              ;;
          esac

          sed 's/^[[:space:]]*//' /tmp/mbr.env.tmp > /tmp/mbr.env
          rm /tmp/mbr.env.tmp

      - name: Upload environment file
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          ROOT_DIR: ${{ steps.config.outputs.root_dir }}
        run: |
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            /tmp/mbr.env \
            "mbr@${DEPLOY_HOST}:${ROOT_DIR}/.env"
          ssh -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no "mbr@${DEPLOY_HOST}" \
            "chmod 600 ${ROOT_DIR}/.env"

      - name: Create fleet config file
        env:
          FLEET_API_URL: ${{ steps.config.outputs.fleet_api_url }}
          INSTANCE_ID: ${{ steps.config.outputs.instance_id }}
          INSTANCE_NAME: ${{ steps.config.outputs.metadata_name }}
          CORE_VERSION: ${{ steps.config.outputs.core_version }}
          FLEET_OPERATOR_EMAIL: ${{ steps.config.outputs.fleet_operator_email }}
          FLEET_USE_CASE: ${{ steps.config.outputs.fleet_use_case }}
          FLEET_REGISTRATION_SOURCE: ${{ steps.config.outputs.fleet_registration_source }}
          FLEET_HEARTBEAT_ENABLED: ${{ steps.config.outputs.fleet_heartbeat_enabled }}
        run: |
          cat > /tmp/mbr.fleet-config.env.tmp <<EOF
          MBR_FLEET_API_URL=${FLEET_API_URL}
          MBR_FLEET_INSTANCE_ID=${INSTANCE_ID}
          MBR_FLEET_INSTANCE_NAME=${INSTANCE_NAME}
          MBR_FLEET_PLATFORM_VERSION=${CORE_VERSION}
          MBR_FLEET_OPERATOR_EMAIL=${FLEET_OPERATOR_EMAIL}
          MBR_FLEET_USE_CASE=${FLEET_USE_CASE}
          MBR_FLEET_REGISTRATION_SOURCE=${FLEET_REGISTRATION_SOURCE}
          MBR_FLEET_HEARTBEAT_ENABLED=${FLEET_HEARTBEAT_ENABLED}
          EOF

          sed 's/^[[:space:]]*//' /tmp/mbr.fleet-config.env.tmp > /tmp/mbr.fleet-config.env
          rm /tmp/mbr.fleet-config.env.tmp

      - name: Upload fleet config file
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          ROOT_DIR: ${{ steps.config.outputs.root_dir }}
        run: |
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            /tmp/mbr.fleet-config.env \
            "mbr@${DEPLOY_HOST}:${ROOT_DIR}/.fleet-config.env"
          ssh -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no "mbr@${DEPLOY_HOST}" \
            "chmod 600 ${ROOT_DIR}/.fleet-config.env"

      - name: Deploy to inactive slot
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          ROOT_DIR: ${{ steps.config.outputs.root_dir }}
          DEPLOY_SLOT: ${{ steps.slot.outputs.deploy_slot }}
          ACTIVE_SLOT: ${{ steps.slot.outputs.active_slot }}
          DEPLOY_PORT: ${{ steps.slot.outputs.deploy_port }}
          FLEET_HEARTBEAT_ENABLED: ${{ steps.config.outputs.fleet_heartbeat_enabled }}
        run: |
          ssh -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no "mbr@${DEPLOY_HOST}" <<EOF
            set -e

            echo "=== Blue-green deploy: ${ACTIVE_SLOT} -> ${DEPLOY_SLOT} ==="
            cd "${ROOT_DIR}"

            rm -rf /tmp/mbr-extract
            mkdir -p /tmp/mbr-extract
            tar -xzf /tmp/mbr-deploy.tar.gz -C /tmp/mbr-extract

            if [ -f /etc/systemd/system/mbr.service ]; then
              sudo /bin/systemctl stop mbr 2>/dev/null || true
              sudo /bin/systemctl disable mbr 2>/dev/null || true
              sudo /bin/rm -f /etc/systemd/system/mbr.service
              sudo /bin/systemctl daemon-reload
            fi

            sudo /bin/systemctl stop "mbr-${DEPLOY_SLOT}" 2>/dev/null || true
            sleep 1

            sudo /bin/cp /tmp/mbr-extract/mbr-server "${ROOT_DIR}/mbr-${DEPLOY_SLOT}"
            sudo /bin/chown mbr:mbr "${ROOT_DIR}/mbr-${DEPLOY_SLOT}"
            sudo /bin/chmod +x "${ROOT_DIR}/mbr-${DEPLOY_SLOT}"

            mkdir -p tools
            rsync -av --delete /tmp/mbr-extract/tools/ tools/ || true
            chmod +x tools/* 2>/dev/null || true

            mkdir -p deploy
            rsync -av --delete /tmp/mbr-extract/deploy/ deploy/ || true
            chmod +x deploy/*.sh 2>/dev/null || true

            mkdir -p extensions
            rsync -av --delete /tmp/mbr-extract/extensions/ extensions/
            chmod 600 extensions/* 2>/dev/null || true

            mkdir -p extensions-runtime/bin tmp/extensions
            rsync -av --delete /tmp/mbr-extract/extension-runtimes/bin/ extensions-runtime/bin/
            chmod +x extensions-runtime/bin/* 2>/dev/null || true
            # Per-extension env files are no longer managed here: as of
            # RFC-0016 the core mbr service supervises extension runtimes
            # as child processes and sets MBR_EXTENSION_RUNTIME_SOCKET_PATH
            # per child from its own slot-scoped config.

            # Clean out any stale env-file directory from the pre-RFC-0016
            # layout. Idempotent; directory is a no-op if absent.
            rm -rf extensions-runtime/env 2>/dev/null || true

            cp /tmp/mbr-extract/deploy/*.service "${ROOT_DIR}/" 2>/dev/null || true

            if ! diff -q "${ROOT_DIR}/mbr-blue.service" /etc/systemd/system/mbr-blue.service >/dev/null 2>&1; then
              sudo /bin/cp "${ROOT_DIR}/mbr-blue.service" /etc/systemd/system/
            fi
            if ! diff -q "${ROOT_DIR}/mbr-green.service" /etc/systemd/system/mbr-green.service >/dev/null 2>&1; then
              sudo /bin/cp "${ROOT_DIR}/mbr-green.service" /etc/systemd/system/
            fi
            if [ -f "${ROOT_DIR}/deploy/mbr-fleet-heartbeat.service" ] && ! diff -q "${ROOT_DIR}/deploy/mbr-fleet-heartbeat.service" /etc/systemd/system/mbr-fleet-heartbeat.service >/dev/null 2>&1; then
              sudo /bin/cp "${ROOT_DIR}/deploy/mbr-fleet-heartbeat.service" /etc/systemd/system/
            fi
            if [ -f "${ROOT_DIR}/deploy/mbr-fleet-heartbeat.timer" ] && ! diff -q "${ROOT_DIR}/deploy/mbr-fleet-heartbeat.timer" /etc/systemd/system/mbr-fleet-heartbeat.timer >/dev/null 2>&1; then
              sudo /bin/cp "${ROOT_DIR}/deploy/mbr-fleet-heartbeat.timer" /etc/systemd/system/
            fi

            # Re-sync /etc/sudoers.d/mbr on every deploy so repo changes to
            # the sudoers allowlist do not drift from the host. Validate
            # with visudo -cf before install; a failed validation aborts
            # the deploy rather than leaving sudoers untouched.
            if sudo /usr/sbin/visudo -cf /tmp/mbr-extract/deploy/mbr-sudoers; then
              sudo /bin/cp /tmp/mbr-extract/deploy/mbr-sudoers /etc/sudoers.d/mbr
              sudo /bin/chmod 440 /etc/sudoers.d/mbr
            else
              echo "sudoers validation failed; aborting deploy" >&2
              exit 1
            fi

            # RFC-0016 one-shot legacy cleanup: stop, disable, and remove
            # any mbr-extension-runtime@*.service instance files; then
            # reap any process that outlived its unit. Extension runtimes
            # are now supervised in-process by the core, and the cleanup
            # is idempotent: once no units and no stray binaries remain,
            # every branch here is a no-op.
            for unit in /etc/systemd/system/mbr-extension-runtime@*.service; do
              [ -e "\${unit}" ] || continue
              instance="\$(basename "\${unit}" .service)"
              # Skip the template itself; the instance pattern requires an @<name>.
              case "\${instance}" in
                mbr-extension-runtime@) continue ;;
              esac

              # Derive the binary name from the instance so we can reap any
              # process that outlives the unit. The unit file's ExecStart is
              # /opt/mbr/extensions-runtime/bin/%i, so the instance name IS
              # the binary name.
              binary_name="\${instance#mbr-extension-runtime@}"

              sudo /bin/systemctl stop "\${instance}" 2>/dev/null || true
              sudo /bin/systemctl disable "\${instance}" 2>/dev/null || true
              sudo /bin/rm -f "\${unit}"

              # systemctl stop is best-effort; on pre-RFC-0016 hosts the
              # actual process sometimes reparents to PID 1 instead of
              # exiting. Reap by binary name with an escalating signal,
              # bounded to ~6s per binary before we move on. Any remaining
              # instance is surfaced by the acceptance checks later in the
              # deploy.
              for signal in TERM TERM KILL; do
                pids="\$(pgrep -f "/extensions-runtime/bin/\${binary_name}\$" || true)"
                [ -z "\${pids}" ] && break
                for pid in \${pids}; do
                  /bin/kill -"\${signal}" "\${pid}" 2>/dev/null || true
                done
                sleep 2
              done
            done
            if [ -e /etc/systemd/system/mbr-extension-runtime@.service ]; then
              sudo /bin/rm -f /etc/systemd/system/mbr-extension-runtime@.service
            fi

            # Final sweep for any runtime process that doesn't match a unit
            # file (already-orphaned before this deploy, or installed
            # out-of-band). All extension runtime binaries live under one
            # directory on the host, so anything there is fair game.
            for pid in \$(pgrep -f '/extensions-runtime/bin/' 2>/dev/null || true); do
              ppid=\$(awk '/^PPid:/{print \$2}' "/proc/\${pid}/status" 2>/dev/null || echo "")
              # Skip children of either slot's core; those are the new
              # supervised processes. Only reap true orphans (ppid 1) and
              # any other surprise parent.
              blue_pid=\$(systemctl show mbr-blue -p MainPID --value 2>/dev/null || echo "")
              green_pid=\$(systemctl show mbr-green -p MainPID --value 2>/dev/null || echo "")
              case "\${ppid}" in
                "\${blue_pid}"|"\${green_pid}")
                  continue
                  ;;
              esac
              echo "Reaping orphan runtime pid=\${pid} ppid=\${ppid}"
              /bin/kill -TERM "\${pid}" 2>/dev/null || true
              sleep 2
              [ -e "/proc/\${pid}" ] && /bin/kill -KILL "\${pid}" 2>/dev/null || true
            done

            sudo /bin/systemctl daemon-reload

            # Start the inactive slot. Its core process will read
            # runtime-manifest.json and spawn the extension runtimes as
            # supervised children; no separate restart loop is needed.
            sudo /bin/systemctl start "mbr-${DEPLOY_SLOT}"

            HEALTHY=false
            for i in \$(seq 1 30); do
              if curl -sf --max-time 5 "http://localhost:${DEPLOY_PORT}/health" >/dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "\${HEALTHY}" = "false" ]; then
              sudo /bin/systemctl stop "mbr-${DEPLOY_SLOT}" || true
              sudo /bin/journalctl -u "mbr-${DEPLOY_SLOT}" --no-pager -n 30
              exit 1
            fi

            MBR_RECONCILE_ROOT_DIR="${ROOT_DIR}" \
            MBR_RECONCILE_DESIRED_STATE_PATH="${ROOT_DIR}/extensions/desired-state.yaml" \
            MBR_RECONCILE_ARTIFACT_DIR="${ROOT_DIR}/reconcile-artifacts/extensions" \
            MBR_RECONCILE_ACTOR="system:mbr-deploy" \
              bash /tmp/mbr-extract/deploy/reconcile-extensions.sh apply-all

            sudo /bin/systemctl stop "mbr-${ACTIVE_SLOT}" 2>/dev/null || true
            sudo /bin/systemctl disable "mbr-${ACTIVE_SLOT}" 2>/dev/null || true
            sudo /bin/systemctl enable "mbr-${DEPLOY_SLOT}" 2>/dev/null || true

            echo "${DEPLOY_SLOT}" | sudo tee "${ROOT_DIR}/.active-slot" >/dev/null
            sudo /bin/chown mbr:mbr "${ROOT_DIR}/.active-slot"

            # Update Prometheus file-based service discovery target
            if [ -x /usr/local/bin/update-prometheus-target ]; then
              sudo /usr/local/bin/update-prometheus-target mbr "${DEPLOY_SLOT}"
            fi

            # Reconcile the fleet heartbeat timer with the disclosed setting.
            # The timer is only started here if it is already enabled on the
            # host; registration (Register Fleet workflow) is what enables it.
            if [ "${FLEET_HEARTBEAT_ENABLED}" = "true" ]; then
              if systemctl is-enabled mbr-fleet-heartbeat.timer >/dev/null 2>&1; then
                sudo /bin/systemctl restart mbr-fleet-heartbeat.timer
              fi
            else
              sudo /bin/systemctl stop mbr-fleet-heartbeat.timer 2>/dev/null || true
              sudo /bin/systemctl disable mbr-fleet-heartbeat.timer 2>/dev/null || true
            fi

            rm -rf /tmp/mbr-extract /tmp/mbr-deploy.tar.gz
          EOF

      - name: Post-deployment health verification
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          DEPLOY_PORT: ${{ steps.slot.outputs.deploy_port }}
        run: |
          sleep 5
          HEALTH=$(ssh -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no "mbr@${DEPLOY_HOST}" \
            "curl -sf http://localhost:${DEPLOY_PORT}/health" 2>&1 || echo '{"status":"failed"}')
          echo "Internal health: ${HEALTH}"
          if echo "${HEALTH}" | grep -q "failed"; then
            echo "Health verification failed"
            exit 1
          fi

      - name: Download reconciliation artifacts
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          ROOT_DIR: ${{ steps.config.outputs.root_dir }}
        run: |
          mkdir -p artifacts/reconcile
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            "mbr@${DEPLOY_HOST}:${ROOT_DIR}/reconcile-artifacts/extensions/plan.json" \
            artifacts/reconcile/plan.json
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            "mbr@${DEPLOY_HOST}:${ROOT_DIR}/reconcile-artifacts/extensions/apply.json" \
            artifacts/reconcile/apply.json
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            "mbr@${DEPLOY_HOST}:${ROOT_DIR}/reconcile-artifacts/extensions/check.json" \
            artifacts/reconcile/check.json
          scp -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no \
            "mbr@${DEPLOY_HOST}:${ROOT_DIR}/reconcile-artifacts/extensions/runtime-manifest.json" \
            artifacts/reconcile/runtime-manifest.json

      - name: Upload reconciliation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: extension-reconcile-${{ inputs.environment }}
          path: artifacts/reconcile/
          if-no-files-found: error

      - name: Smoke tests
        env:
          API_DOMAIN: ${{ steps.config.outputs.api_domain }}
          ADMIN_DOMAIN: ${{ steps.config.outputs.admin_domain }}
        run: |
          sleep 10

          FAILED=0
          API_URL="https://${API_DOMAIN}"
          ADMIN_URL="https://${ADMIN_DOMAIN}"

          API_HEALTH=$(curl -sf -m 15 "${API_URL}/health" 2>&1) || {
            echo "API health endpoint failed"
            FAILED=1
          }
          echo "API health: ${API_HEALTH}"

          ADMIN_HEALTH=$(curl -sf -m 15 "${ADMIN_URL}/health" 2>&1) || {
            echo "Admin health endpoint failed"
            FAILED=1
          }
          echo "Admin health: ${ADMIN_HEALTH}"

          LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "${ADMIN_URL}/login")
          if [ "${LOGIN_STATUS}" -ne 200 ]; then
            echo "Login page returned ${LOGIN_STATUS}"
            FAILED=1
          fi

          if [ "${FAILED}" -ne 0 ]; then
            echo "Smoke tests failed"
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519_deploy

      - name: Create deployment summary
        env:
          CORE_VERSION: ${{ steps.config.outputs.core_version }}
          DEPLOY_SLOT: ${{ steps.slot.outputs.deploy_slot }}
          ACTIVE_SLOT: ${{ steps.slot.outputs.active_slot }}
          DEPLOY_PORT: ${{ steps.slot.outputs.deploy_port }}
          SERVICES_ARTIFACT: ${{ steps.config.outputs.services_artifact }}
          MIGRATIONS_ARTIFACT: ${{ steps.config.outputs.migrations_artifact }}
          APP_DOMAIN: ${{ steps.config.outputs.app_domain }}
          ADMIN_DOMAIN: ${{ steps.config.outputs.admin_domain }}
          API_DOMAIN: ${{ steps.config.outputs.api_domain }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Complete

          **Environment**: ${{ inputs.environment }}
          **Core Version**: ${CORE_VERSION}
          **Deployment Slot**: ${DEPLOY_SLOT}

          ### Blue-Green Deployment
          - Previous slot: ${ACTIVE_SLOT}
          - New slot: ${DEPLOY_SLOT}
          - Port: ${DEPLOY_PORT}

          ### Artifacts Deployed
          - \`${SERVICES_ARTIFACT}\`
          - \`${MIGRATIONS_ARTIFACT}\`
          - local deploy assets from this instance repo

          ### Reconciliation Artifacts
          - \`artifacts/reconcile/plan.json\`
          - \`artifacts/reconcile/apply.json\`
          - \`artifacts/reconcile/check.json\`
          - \`artifacts/reconcile/runtime-manifest.json\`

          ### Endpoints
          - https://${APP_DOMAIN}
          - https://${ADMIN_DOMAIN}
          - https://${API_DOMAIN}
          EOF
