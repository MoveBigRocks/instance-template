apiVersion: mbr.demandops.com/v1alpha1
kind: MBRInstance
metadata:
  name: acme-prod
  instanceID: replace-with-generated-instance-id
spec:
  environment: production
  domain:
    app: app.example.com
    admin: admin.example.com
    api: api.example.com
    cookie: .example.com
  deployment:
    strategy: blue-green
    linuxTarget:
      host: replace-with-host
      rootDir: /opt/mbr
    release:
      # Pin all four fields to the SAME released platform tag. Replace vX.Y.Z
      # with a real tag from https://github.com/MoveBigRocks/platform/tags.
      # See deploy/UPGRADE.md. The deploy verifies that this tag's git commit
      # and its OCI manifest agree before rolling out.
      core:
        version: vX.Y.Z
        servicesArtifact: ghcr.io/movebigrocks/mbr-services:vX.Y.Z
        migrationsArtifact: ghcr.io/movebigrocks/mbr-migrations:vX.Y.Z
        manifestArtifact: ghcr.io/movebigrocks/mbr-manifest:vX.Y.Z
        # Resolve and pin these immutable digests before the first production
        # deploy. The deploy rejects a tag whose registry digest differs.
        servicesDigest: ""
        migrationsDigest: ""
        manifestDigest: ""
  auth:
    mode: magic-link
    breakGlassAdminEmail: owner@example.com
  email:
    outbound:
      provider: postmark
      fromEmail: support@example.com
      fromName: Example Support
      smtp:
        host: smtp.example.com
        port: 587
      ses:
        region: us-east-1
    inbound:
      mode: webhook
      provider: postmark
  storage:
    provider: s3-compatible
    region: ams3
    endpoint: https://ams3.digitaloceanspaces.com
    attachmentsBucket: mbr-attachments-example
  monitoring:
    internalHealth: true
    internalMetrics: true
  fleet:
    # Explicit control-plane registration for support, grandfathering, and
    # future commercial entitlements. The core platform still runs if this
    # endpoint is unreachable.
    endpoint: https://movebigrocks.com
    registration:
      operatorEmail: owner@example.com
      useCase: internal_ops
      source: self_hosted
    heartbeat:
      # Coarse weekly callback only. No case content, conversation content,
      # end-user identities, or customer records are sent.
      enabled: true
  agent:
    bootstrap:
      createAdmin: true
      createWorkspace: true
      seedDefaults: true
      runThreatModelPrompt: true
  extensions:
    autoActivateAfterInstall: false
    desiredStateFile: extensions/desired-state.yaml
    policy:
      allowCustomExtensions: true
      allowMarketplaceExtensions: false
      genericRuntimeAllowedKinds:
        - product
        - operational
      genericRuntimeAllowedRisk:
        - standard
      requireThreatModelReview: true
      requireStagingValidation: true
      blockPrivilegedCustomExtensions: true
  branding:
    file: branding/site.json
  security:
    artifactSignature:
      # First-party release artifacts are signed keylessly by this exact
      # GitHub Actions OIDC identity. Production deploys fail closed when the
      # signature is absent or comes from any other workflow.
      requireCosign: true
      verificationMode: keyless
      certificateIdentity: https://github.com/MoveBigRocks/platform/.github/workflows/production.yml@refs/heads/main
      certificateOidcIssuer: https://token.actions.githubusercontent.com
      # Switch verificationMode to key to use a customer-owned public key.
      cosignPublicKeyFile: security/cosign.pub
    extensionThreatModelFile: security/extension-threat-model.md
    extensionReviewChecklistFile: security/review-checklist.md
